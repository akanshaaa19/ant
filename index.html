<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4B1620" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Art Night Thursday — Mumbai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only Fraunces is loaded over the network; body + mono use the OS stacks.
         Roman only, axes trimmed to the ranges this design actually exercises:
         opsz 14–96, wght 380–460, SOFT 50–100. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@14..96,380..460,50..100&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply theme before paint to avoid a light/dark flash.
      // Mirrors the resolution order ThemeToggle uses: stored choice → system pref.
      (function () {
        try {
          var raw = localStorage.getItem('mga-theme');
          var theme = raw ? JSON.parse(raw) : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#4B1620' : '#F4EBD1');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
